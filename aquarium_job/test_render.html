<!doctype html><html><head><meta charset="utf-8"><style>@page{size:A4;margin:10mm}body{font-family:Arial;color:#123} .page{page-break-after:always;height:270mm} img{width:120mm}</style></head><body><div class="page"><h1>Test encyclopédie aquarium illustrée</h1><p>Chargement de la photo...</p><img id="fish" alt="Guppy"></div><div id="ready">READY</div><script>(async()=>{try{const r=await fetch('https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&prop=pageimages&piprop=thumbnail&pithumbsize=900&titles=Poecilia%20reticulata');const j=await r.json();const p=Object.values(j.query.pages)[0];document.getElementById('fish').src=p.thumbnail.source;await new Promise(res=>{document.getElementById('fish').onload=res;setTimeout(res,5000)});}catch(e){document.body.insertAdjacentHTML('beforeend','<pre>'+e+'</pre>')}document.getElementById('ready').dataset.done='1';})();</script></body></html>
